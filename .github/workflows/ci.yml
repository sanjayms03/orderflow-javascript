name: test
on:
  pull_request_target:
  push:
permissions: write-all
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: echo "example token ${{ secrets.DEMO_TOKEN }}"
      - run: npm test
